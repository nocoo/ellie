# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, L1, L2, L3, Z1;
# na L1.5, P1; todo B1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L3 prepare/browsers.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.4"
      node-version: "26.12.1"
      install-policy: project
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test
      coverage-path: ""
      lockfiles: bun.lock,packages/cli-rs/Cargo.lock
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e:api
      l3: true
      l3-browsers: chromium
      l3-prepare-command: |
        timeout 8m bash -euo pipefail <<'PLAYWRIGHT_SETUP'
        set -euo pipefail
        printf '%s\n' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          'Acquire::Retries "2";' \
          | sudo tee /etc/apt/apt.conf.d/99-ellie-timeout >/dev/null
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' \
            'http://archive.ubuntu.com/ubuntu/' \
            'http://security.ubuntu.com/ubuntu/' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          echo "apt-mirrors.txt rewritten to:"
          cat /etc/apt/apt-mirrors.txt
        else
          echo "WARN: /etc/apt/apt-mirrors.txt missing — falling back to sources rewrite"
        fi
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list || true
        fi
        if grep -Rns 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt \
          /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
          echo "::error::azure.archive.ubuntu.com still present in apt configuration"
          exit 1
        fi
        echo "apt sources OK (no azure.archive.ubuntu.com)"
        PLAYWRIGHT_SETUP
      l3-command: bun run test:e2e:bdd
      env-json: '{"TZ":"Asia/Shanghai"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "todo", "reason": "CI 未单独跑 build；生产镜像在 deploy-docker 阶段构建"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "未接入 @cloudflare/vitest-pool-workers / miniflare；Worker 单测在 vitest threads（L1）运行"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "根 package.json 为 private monorepo，不发布 npm 包"},
        "Z1": {"status": "impl"}}
    secrets:
      test-env-json: ${{ format('{{"NEXT_PUBLIC_CAP_API_ENDPOINT":{0}}}', toJSON(secrets.NEXT_PUBLIC_CAP_API_ENDPOINT)) }}
