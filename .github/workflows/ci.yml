name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: 1.4.2
      install-policy: project
      coverage-path: ''
      test-command: bun run test
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      security: false
      disabled-check-reasons: '{"security":"The dedicated security job scans the Bun and Rust lockfiles together."}'
  security-scan:
    name: G2 Security Scan
    uses: nocoo/base-ci/.github/workflows/security.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      lockfiles: bun.lock,packages/cli-rs/Cargo.lock
  api-e2e:
    name: L2 API E2E
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: 1.4.2
      node-version: 22.23.2
      install-policy: blocked
      timeout-minutes: 20
      command: bun run test:e2e:api
  browser-e2e:
    name: L3 Browser E2E
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: 1.4.2
      node-version: 22.23.2
      install-policy: blocked
      timeout-minutes: 25
      pre-command: |
        timeout 8m bash -euo pipefail <<'PLAYWRIGHT_SETUP'
        set -euo pipefail
        printf '%s\n' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          'Acquire::Retries "2";' \
          | sudo tee /etc/apt/apt.conf.d/99-ellie-timeout >/dev/null
        # GHA ubuntu images resolve packages via mirror+file:/etc/apt/apt-mirrors.txt
        # (see job logs: "Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist"). Editing
        # only sources.list / ubuntu.sources is a silent no-op on those runners.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' \
            'http://archive.ubuntu.com/ubuntu/' \
            'http://security.ubuntu.com/ubuntu/' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          echo "apt-mirrors.txt rewritten to:"
          cat /etc/apt/apt-mirrors.txt
        else
          echo "WARN: /etc/apt/apt-mirrors.txt missing — falling back to sources rewrite"
        fi
        # Belt-and-suspenders for classic direct-URI sources.
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list || true
        fi
        # Fail loud if azure mirror is still referenced anywhere apt reads.
        if grep -Rns 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt \
          /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
          echo "::error::azure.archive.ubuntu.com still present in apt configuration"
          exit 1
        fi
        echo "apt sources OK (no azure.archive.ubuntu.com)"
        bunx playwright install --with-deps chromium
        PLAYWRIGHT_SETUP
      command: bun run test:e2e:bdd
      env-json: '{"TZ":"Asia/Shanghai"}'
    secrets:
      test-env-json: ${{ format('{{"NEXT_PUBLIC_CAP_API_ENDPOINT":{0}}}', toJSON(secrets.NEXT_PUBLIC_CAP_API_ENDPOINT)) }}
  release-smoke:
    name: Release Workflow Smoke
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      yamllint: true
permissions:
  contents: read
