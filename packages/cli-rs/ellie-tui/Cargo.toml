[package]
name = "ellie-tui"
version = "1.14.20"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ellie-tui"
path = "src/main.rs"

[dependencies]
ellie-core = { path = "../ellie-core" }
anyhow = "1.0.104"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
